name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests et build
    runs-on: ubuntu-latest

    env:
      # Valeurs factices : le build Next.js a besoin que ces variables existent,
      # aucune connexion réelle n'est ouverte pendant la CI.
      DATABASE_URL: mongodb://localhost:27017/ci
      NEXTAUTH_SECRET: ci-secret-not-used-outside-of-this-job
      NEXTAUTH_URL: http://localhost:3000
      JWT_SECRET: ci-secret-not-used-outside-of-this-job

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Build Next.js
        run: npx next build
