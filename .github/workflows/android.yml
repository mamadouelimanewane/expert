name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Next.js Build
        run: npm run build
        env:
          # Un build Android ne doit jamais recevoir les secrets d'une base
          # ou d'une instance réelle. Ces valeurs factices suffisent au build.
          DATABASE_URL: mongodb://localhost:27017/ci
          JWT_SECRET: ci-secret-not-used-outside-of-this-job
          NEXTAUTH_SECRET: ci-secret-not-used-outside-of-this-job
          NEXTAUTH_URL: http://localhost:3000
          TENANT_DATA_ISOLATION_READY: "false"

      - name: Capacitor Sync
        run: npx cap sync

      - name: Build Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
